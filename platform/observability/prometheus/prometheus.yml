global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'channels_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['channels-service:8080']

  - job_name: 'api_gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'ingestion'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion:8080']

rule_files: []
