apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      # Do log para o trace no Tempo.
      derivedFields:
        - name: TraceId
          datasourceUid: tempo
          matcherRegex: '"TraceId":"(\w+)"'
          url: "$${__value.raw}"
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: sentinel
