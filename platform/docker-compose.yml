services:
  api-gateway:
    image: api-gateway
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7000:8080"
    restart: unless-stopped
    networks:
      - sentinel-network
  ingestion:
    image: ingestion
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: ingestion
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - ServiceToken__Audience=${JWT_AUDIENCE:-sentinel}
      - ServiceToken__SigningKey=${INGESTION_SERVICE_TOKEN_SIGNING_KEY}
      - ConnectionStrings__IngestionWriteDatabase=${ConnectionStrings__IngestionWriteDatabase:-Host=postgres;Port=5432;Database=ingestion;Username=postgres;Password=postgres}
      - ConnectionStrings__IngestionReadDatabase=${ConnectionStrings__IngestionReadDatabase:-Host=postgres;Port=5432;Database=ingestion;Username=postgres;Password=postgres}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka:-kafka:9092}
      - MinIO__Host=${MinIO__Host:-minio}
      - MinIO__Port=${MinIO__Port:-9000}
      - MinIO__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Geospatial__BaseUrl=http://geospatial:8080
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7001:8080"
    depends_on:
      - postgres
      - mongodb
      - elasticsearch
      - redis
      - minio
      - kafka
      - geospatial
    restart: unless-stopped
    networks:
      - sentinel-network
  risk-catalog:
    image: risk-catalog
    build:
      context: ../services/risk-catalog
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: risk-catalog
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__TrustedServices__0__Name=risk-evaluation
      - Jwt__TrustedServices__0__Issuer=sentinel-service:risk-evaluation
      - Jwt__TrustedServices__0__SigningKey=${RISK_EVALUATION_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__0__AllowedRoles__0=RiskCatalog.Read
      - ServiceToken__Audience=${JWT_AUDIENCE:-sentinel}
      - ServiceToken__SigningKey=${RISK_CATALOG_SERVICE_TOKEN_SIGNING_KEY}
      - ConnectionStrings__RiskCatalogDatabase=${ConnectionStrings__IngestionDatabase:-Host=postgres;Port=5432;Database=risk_catalog;Username=postgres;Password=postgres}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka:-kafka:9092}
      - Redis__MaxMemory=256mb
      - Redis__EvictionPolicy=allkeys-lru
      - GEOSPATIAL_SERVICE_URL=http://geospatial:8080
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7002:8080"
    depends_on:
      - postgres
      - elasticsearch
      - redis
      - kafka
      - geospatial
    restart: unless-stopped
    networks:
      - sentinel-network
  geospatial:
    image: geospatial
    build:
      context: ../services/geospatial
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: geospatial
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__TrustedServices__0__Name=ingestion
      - Jwt__TrustedServices__0__Issuer=sentinel-service:ingestion
      - Jwt__TrustedServices__0__SigningKey=${INGESTION_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__0__AllowedRoles__0=Geospatial.Read
      - Jwt__TrustedServices__1__Name=risk-catalog
      - Jwt__TrustedServices__1__Issuer=sentinel-service:risk-catalog
      - Jwt__TrustedServices__1__SigningKey=${RISK_CATALOG_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__1__AllowedRoles__0=Geospatial.Read
      - Elasticsearch__Url=http://elasticsearch:9200
      - Elasticsearch__DefaultIndex=geospatial-events
      - ConnectionStrings__Kafka=kafka:9092
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7003:8080"
    depends_on:
      - elasticsearch
      - loki
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  risk-evaluation:
    image: risk-evaluation
    build:
      context: ../services/risk-evaluation
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: risk-evaluation
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - ServiceToken__Audience=${JWT_AUDIENCE:-sentinel}
      - ServiceToken__SigningKey=${RISK_EVALUATION_SERVICE_TOKEN_SIGNING_KEY}
      - Services__RiskCatalog__BaseUrl=http://risk-catalog:8080
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - ConnectionStrings__Redis=redis:6379
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=risk-events
      - Kafka__GroupId=risk-evaluation-group
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7004:8080"
    depends_on:
      - mongodb
      - redis
      - kafka
      - risk-catalog
      - loki
    restart: unless-stopped
    networks:
      - sentinel-network
  alert-orchestrator:
    image: alert-orchestrator
    build:
      context: ../services/alert-orchestrator
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: alert-orchestrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - ServiceToken__Audience=${JWT_AUDIENCE:-sentinel}
      - ServiceToken__SigningKey=${ALERT_ORCHESTRATOR_SERVICE_TOKEN_SIGNING_KEY}
      - Database__UsePostgreSql=true
      - Database__PostgreSqlConnectionString=Host=postgres;Port=5432;Database=alert_orchestrator;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Cache__UseRedis=true
      - Cache__RedisConnectionString=redis:6379
      - Services__TenantsBillingBaseUrl=http://tenants-billing:8080
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=alert-orchestrator-group
      - Kafka__Topics__RiskUpdated=risk-updated
      - Kafka__Topics__RegionIntersected=region-intersected
      - Kafka__Topics__Event=alert-orchestrator-events
      - Kafka__Topics__Command=alert-commands
      - Kafka__Topics__DeadLetter=alert-orchestrator-dead-letter
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7005:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  tenants-billing:
    image: tenants-billing
    build:
      context: ../services/tenants-billing
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: tenants-billing
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__TrustedServices__0__Name=ingestion
      - Jwt__TrustedServices__0__Issuer=sentinel-service:ingestion
      - Jwt__TrustedServices__0__SigningKey=${INGESTION_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__0__AllowedRoles__0=TenantsBilling.Read
      - Jwt__TrustedServices__1__Name=alert-orchestrator
      - Jwt__TrustedServices__1__Issuer=sentinel-service:alert-orchestrator
      - Jwt__TrustedServices__1__SigningKey=${ALERT_ORCHESTRATOR_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__1__AllowedRoles__0=TenantsBilling.Read
      - Jwt__TrustedServices__2__Name=channels
      - Jwt__TrustedServices__2__Issuer=sentinel-service:channels
      - Jwt__TrustedServices__2__SigningKey=${CHANNELS_SERVICE_TOKEN_SIGNING_KEY}
      - Jwt__TrustedServices__2__AllowedRoles__0=TenantsBilling.Read
      - ConnectionStrings__TenantsBillingDatabase=Host=postgres;Port=5432;Database=tenants_billing;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=tenants-billing-events
      - Kafka__UsageTopic=tenant-usage-events
      - Kafka__DeadLetterTopic=tenant-usage-events-dlq
      - Kafka__ReplayTopic=tenant-usage-events-replay
      - Kafka__ConsumerGroupId=tenants-billing-consumer-group
      - Kafka__DeadLetterConsumerGroupId=tenants-billing-dlq-group
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7006:8080"
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  channels:
    image: channels
    build:
      context: ../services/channels
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: channels
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - ServiceToken__Audience=${JWT_AUDIENCE:-sentinel}
      - ServiceToken__SigningKey=${CHANNELS_SERVICE_TOKEN_SIGNING_KEY}
      - ConnectionStrings__ChannelsServiceDatabase=Host=postgres;Port=5432;Database=channels;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__Configuration=redis:6379
      - Services__TenantsBillingBaseUrl=http://tenants-billing:8080
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=channels-service-group
      - Kafka__Topic=notification-events
      - Kafka__DeadLetterTopic=notification-events-dlq
      - Kafka__ConsumerDeadLetterTopic=channels-dead-letter
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
      # Provider credentials are optional locally; without them deliveries fail and go to notification-events-dlq.
      - ChannelsService__Providers__Email__Options__ApiKey=${SENDGRID_API_KEY:-}
      - ChannelsService__Providers__Sms__Options__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - ChannelsService__Providers__Sms__Options__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - ChannelsService__Providers__WhatsApp__Options__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - ChannelsService__Providers__WhatsApp__Options__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - ChannelsService__Providers__Push__Options__ApiKey=${PUSH_API_KEY:-}
      - ChannelsService__Providers__Siren__Options__ApiKey=${SIREN_API_KEY:-}
    ports:
      - "7008:8080"
    depends_on:
      - postgres
      - redis
      - kafka
      - tenants-billing
    restart: unless-stopped
    networks:
      - sentinel-network

  reporting:
    image: reporting
    build:
      context: ../services/reporting
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: reporting
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Elasticsearch__IndexName=reporting-events
      - Redis__Configuration=redis:6379
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=reporting-events
      - Kafka__DeadLetterTopic=reporting-events-dead-letter
      - Kafka__ReplayTopic=reporting-events-replay
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7009:8080"
    depends_on:
      - elasticsearch
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network

  audit-compliance:
    image: audit-compliance
    build:
      context: ../services/audit-compliance
      dockerfile: Dockerfile
      additional_contexts:
        repo-root: ..
    container_name: audit-compliance
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://audit_compliance_app:${AUDIT_COMPLIANCE_DB_PASSWORD:-audit_compliance_local}@mongodb:27017/AuditComplianceDatabase?authSource=AuditComplianceDatabase
      - MongoDb__DatabaseName=AuditComplianceDatabase
      - MongoDb__EnsureIndexesOnStartup=false
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=audit-compliance-group
      - Kafka__AuditEventsTopic=audit-events
      - Kafka__ReplayTopic=audit-events-replay
      - Kafka__DeadLetterTopic=audit-events-dlq
      - Jwt__Issuer=${JWT_ISSUER:-sentinel}
      - Jwt__Audience=${JWT_AUDIENCE:-sentinel}
      - Jwt__SigningKey=${AUDIT_COMPLIANCE_JWT_SIGNING_KEY:-${JWT_SIGNING_KEY}}
      - Loki__Url=http://loki:3100
      - OpenTelemetry__OtlpEndpoint=http://tempo:4317
    ports:
      - "7007:8080"
    depends_on:
      - mongodb
      - kafka
      - loki
    restart: unless-stopped
    networks:
      - sentinel-network
  postgres:
    image: postgres:15.5
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-mongoadmin}
      - AUDIT_COMPLIANCE_DB_PASSWORD=${AUDIT_COMPLIANCE_DB_PASSWORD:-audit_compliance_local}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./init-db/mongodb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  minio:
    # As imagens públicas do MinIO deixaram de ser publicadas; esta é a build da Chainguard a partir do fonte
    # (MinIO RELEASE.2026-10-23, AGPL), fixada por digest porque o plano gratuito só publica `latest`. Roda como
    # uid 65532: um volume minio-data criado pela imagem antiga (root) precisa de chown ou ser recriado.
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - sentinel-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - sentinel-network
  kafka-init:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Esperando Kafka subir...'
      sleep 10

      echo 'Criando tópicos...'

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-catalog-published --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic disaster-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic climatic-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-evaluated --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic geospatial-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-updated --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic region-intersected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-orchestrator-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-commands --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenants-billing-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events-dlq --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events-replay --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events-replay --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events-dlq --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-orchestrator-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-evaluation-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification-events-dlq --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic channels-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic reporting-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic reporting-events-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic reporting-events-replay --partitions 1 --replication-factor 1

      echo 'Tópicos criados:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: no
    networks:
      - sentinel-network
  kafkaui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      - sentinel-network
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.17.4
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - sentinel-network
    restart: unless-stopped
  kibana:
    container_name: kibana
    image: kibana:8.17.4
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - sentinel-network
    restart: unless-stopped
  loki:
    container_name: loki
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - sentinel-network
    restart: unless-stopped
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - sentinel-network
    restart: unless-stopped
  tempo-init:
    # Tempo roda com o uid 10001; o volume nomeado nasce com dono root.
    image: grafana/tempo:2.6.1
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    networks:
      - sentinel-network
  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    networks:
      - sentinel-network
    restart: unless-stopped
  grafana:
    container_name: grafana
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
      - tempo
    networks:
      - sentinel-network
    restart: unless-stopped
volumes:
  prometheus-data:
  postgres-data:
  mongo-data:
  mongo-config:
  redis-data:
  minio-data:
  elasticsearch-data:
  loki-data:
  tempo-data:
  grafana-data:
networks:
  sentinel-network:
