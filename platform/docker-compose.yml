services:
  api-gateway:
    image: api-gateway
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7000:8080"
    restart: unless-stopped
    networks:
      - sentinel-network
  ingestion:
    image: ingestion
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
    container_name: ingestion
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IngestionWriteDatabase=${ConnectionStrings__IngestionWriteDatabase}
      - ConnectionStrings__IngestionReadDatabase=${ConnectionStrings__IngestionReadDatabase}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka}
      - MinIO__Host=${MinIO__Host}
      - MinIO__Port=${MinIO__Port}
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
    ports:
      - "7001:8080"
    depends_on:
      - postgres
      - mongodb
      - elasticsearch
      - redis
      - minio
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  risk-catalog:
    image: risk-catalog
    build:
      context: ../services/risk-catalog
      dockerfile: Dockerfile
    container_name: risk-catalog
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__RiskCatalogDatabase=${ConnectionStrings__IngestionDatabase}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka}
      - Redis__MaxMemory=256mb
      - Redis__EvictionPolicy=allkeys-lru
    ports:
      - "7002:8080"
    depends_on:
      - postgres
      - elasticsearch
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  geospatial:
    image: geospatial
    build:
      context: ../services/geospatial
      dockerfile: Dockerfile
    container_name: geospatial
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elasticsearch__Url=http://elasticsearch:9200
      - Loki__Url=http://loki:3100
    ports:
      - "7003:8080"
    depends_on:
      - elasticsearch
      - loki
    restart: unless-stopped
    networks:
      - sentinel-network
  postgres:
    image: postgres:15.5
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./init-db/mongodb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  minio:
    image: minio/minio:RELEASE.2025-12-11T05-00-58Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - sentinel-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - sentinel-network
  kafkaui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      - sentinel-network
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.17.4
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - sentinel-network
    restart: unless-stopped
  kibana:
    container_name: kibana
    image: kibana:8.17.4
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - sentinel-network
    restart: unless-stopped
  loki:
    container_name: loki
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - sentinel-network
    restart: unless-stopped
volumes:
  postgres-data:
  mongo-data:
  redis-data:
  minio-data:
  elasticsearch-data:
  loki-data:
networks:
  sentinel-network:
  