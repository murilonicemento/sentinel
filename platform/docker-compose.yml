services:
  api-gateway:
    image: api-gateway
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "7000:8080"
    restart: unless-stopped
    networks:
      - sentinel-network
  ingestion:
    image: ingestion
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
    container_name: ingestion
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IngestionWriteDatabase=${ConnectionStrings__IngestionWriteDatabase:-Host=postgres;Port=5432;Database=ingestion;Username=postgres;Password=postgres}
      - ConnectionStrings__IngestionReadDatabase=${ConnectionStrings__IngestionReadDatabase:-Host=postgres;Port=5432;Database=ingestion;Username=postgres;Password=postgres}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka:-kafka:9092}
      - MinIO__Host=${MinIO__Host:-minio}
      - MinIO__Port=${MinIO__Port:-9000}
      - MinIO__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - Geospatial__BaseUrl=http://geospatial:8080
    ports:
      - "7001:8080"
    depends_on:
      - postgres
      - mongodb
      - elasticsearch
      - redis
      - minio
      - kafka
      - geospatial
    restart: unless-stopped
    networks:
      - sentinel-network
  risk-catalog:
    image: risk-catalog
    build:
      context: ../services/risk-catalog
      dockerfile: Dockerfile
    container_name: risk-catalog
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__RiskCatalogDatabase=${ConnectionStrings__IngestionDatabase:-Host=postgres;Port=5432;Database=risk_catalog;Username=postgres;Password=postgres}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - ConnectionStrings__Kafka=${ConnectionStrings__Kafka:-kafka:9092}
      - Redis__MaxMemory=256mb
      - Redis__EvictionPolicy=allkeys-lru
      - GEOSPATIAL_SERVICE_URL=http://geospatial:8080
    ports:
      - "7002:8080"
    depends_on:
      - postgres
      - elasticsearch
      - redis
      - kafka
      - geospatial
    restart: unless-stopped
    networks:
      - sentinel-network
  geospatial:
    image: geospatial
    build:
      context: ../services/geospatial
      dockerfile: Dockerfile
    container_name: geospatial
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elasticsearch__Url=http://elasticsearch:9200
      - Elasticsearch__DefaultIndex=geospatial-events
      - Loki__Url=http://loki:3100
      - ConnectionStrings__Kafka=kafka:9092
    ports:
      - "7003:8080"
    depends_on:
      - elasticsearch
      - loki
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  risk-evaluation:
    image: risk-evaluation
    build:
      context: ../services/risk-evaluation
      dockerfile: Dockerfile
    container_name: risk-evaluation
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=risk-events
      - Kafka__GroupId=risk-evaluation-group
      - Loki__Url=http://loki:3100
      - LOKI_URL=http://loki:3100
    ports:
      - "7004:8080"
    depends_on:
      - mongodb
      - kafka
      - loki
    restart: unless-stopped
    networks:
      - sentinel-network
  alert-orchestrator:
    image: alert-orchestrator
    build:
      context: ../services/alert-orchestrator
      dockerfile: Dockerfile
    container_name: alert-orchestrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSql=Host=postgres;Port=5432;Database=alert_orchestrator;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Kafka=kafka:9092
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=alert-orchestrator-group
      - Kafka__RiskUpdatedTopic=risk-updated
      - Kafka__RegionIntersectedTopic=region-intersected
      - Kafka__EventTopic=alert-orchestrator-events
      - Kafka__CommandTopic=alert-commands
    ports:
      - "7005:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  tenants-billing:
    image: tenants-billing
    build:
      context: ../services/tenants-billing
      dockerfile: Dockerfile
    container_name: tenants-billing
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TenantsBillingDatabase=Host=postgres;Port=5432;Database=tenants_billing;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=tenants-billing-events
      - Kafka__UsageTopic=tenant-usage-events
      - Kafka__DeadLetterTopic=tenant-usage-events-dlq
      - Kafka__ReplayTopic=tenant-usage-events-replay
      - Kafka__ConsumerGroupId=tenants-billing-consumer-group
      - Kafka__DeadLetterConsumerGroupId=tenants-billing-dlq-group
    ports:
      - "7006:8080"
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped
    networks:
      - sentinel-network
  postgres:
    image: postgres:15.5
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sentinel}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-mongoadmin}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./init-db/mongodb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - sentinel-network
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  minio:
    image: minio/minio:RELEASE.2025-12-11T05-00-58Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - sentinel-network
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - sentinel-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - sentinel-network
  kafka-init:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Esperando Kafka subir...'
      sleep 10

      echo 'Criando tópicos...'

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-catalog-published --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic disaster-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic climatic-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-evaluated --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor-event-detected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic geospatial-dead-letter --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-updated --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic region-intersected --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-orchestrator-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-commands --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenants-billing-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events-dlq --partitions 1 --replication-factor 1

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic tenant-usage-events-replay --partitions 1 --replication-factor 1

      echo 'Tópicos criados:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: no
    networks:
      - sentinel-network
  kafkaui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      - sentinel-network
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.17.4
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - sentinel-network
    restart: unless-stopped
  kibana:
    container_name: kibana
    image: kibana:8.17.4
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - sentinel-network
    restart: unless-stopped
  loki:
    container_name: loki
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - sentinel-network
    restart: unless-stopped
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - sentinel-network
    restart: unless-stopped
  grafana:
    container_name: grafana
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - sentinel-network
    restart: unless-stopped
volumes:
  prometheus-data:
  postgres-data:
  mongo-data:
  mongo-config:
  redis-data:
  minio-data:
  elasticsearch-data:
  loki-data:
  grafana-data:
networks:
  sentinel-network:
